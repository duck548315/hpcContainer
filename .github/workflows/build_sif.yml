name: Build Singularity SIF
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Singularity
        run: |
          sudo apt-get update && sudo apt-get install -y singularity-container

      - name: Build SIFs
        run: |
          mkdir -p outputs
          for def in defs/*.def; do
            name=$(basename $def .def)
            sudo singularity build outputs/${name}.sif $def
          done

      # change to your own huggingface repo name and token
      - name: Upload to HuggingFace
        run: |
          pip install huggingface_hub
          for sif in outputs/*.sif; do
            huggingface-cli upload \
              nullsky/hpcContainer \
              $sif \
              --repo-type dataset \
              --token ${{ secrets.HF_TOKEN }}
          done
        
