name: Build Singularity SIF
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Singularity
        run: |
          sudo apt-get update && sudo apt-get install -y singularity-container

      - name: Build SIFs
        run: |
          mkdir -p outputs
          for def in defs/*.def; do
            name=$(basename $def .def)
            sudo singularity build outputs/${name}.sif $def
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with: 
          files: outputs/*.sif
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
