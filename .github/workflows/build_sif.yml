name: Build Singularity SIF
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Singularity
        run: |
          sudo apt-get update && sudo apt-get install -y singularity-container

      - name: Build SIFs
        run: |
          mkdir -p outputs
          for def in defs/*.def; do
            name=$(basename $def .def)
            singularity build --fakeroot outputs/${name}.sif $def
          done

      - name: Make SIF artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: all-sifs
          path: outputs/
        
